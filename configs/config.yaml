docker:
  hosts:
    - "unix:///var/run/docker.sock"
  include_patterns:
    - "*"
  since: "0s"

filters:
  warn_match:
    regexps:
      - '(?i)\b(WARN|ERROR)\b'
    exclude_regexps: []
    # 白名单 IP，命中后整条日志不告警；和 exclude_regexps 区别在于无需自己写正则
    exclude_ips:
      # 腾讯云官方安服团队专用扫描 IP
      - "106.55.202.118"
      - "113.96.223.69"
      - "125.39.132.125"
      - "43.139.209.119"
    # 链路级过滤：当一条日志命中 exclude_ips/exclude_regexps 时，记录其 log_id，
    # 在 TTL 内同一 log_id 的所有后续日志（包括不带 IP 的 ERROR/WARN）都会被静默，
    # 避免链路中后半段告警漏出。留空或 "0s" 关闭。
    exclude_chain_ttl: "10m"
    json_fields:
      - "level"
    message_fields:
      - "message"
      - "msg"
      - "log"
    time_fields:
      - "ts"
  log_id_extract:
    json_keys:
      - "id"
    regexps:
      - '(?i)\bid["''=:\s]+([A-Za-z0-9._:-]+)'
      - '(?i)\brequest[_-]?id["''=:\s]+([A-Za-z0-9._:-]+)'
      - '(?i)\blog[_-]?id["''=:\s]+([A-Za-z0-9._:-]+)'
      - '(?i)\balert[_-]?id["''=:\s]+([A-Za-z0-9._:-]+)'
      - '(?i)\btrace[_-]?id["''=:\s]+([A-Za-z0-9._:-]+)'

aggregation:
  flush_size: 20
  flush_interval: "10s"
  unknown_log_id: "unknown"
  max_groups: 10000      # 无告警分组数量上限，0=不限制
  group_ttl: "1m"       # 无告警分组空闲过期时间，0s=关闭

runtime:
  memory_limit: "512MiB"  # Go 进程软内存上限，0 或空表示不限制；GOMEMLIMIT 环境变量优先

dingtalk:
  webhook_url: ""
  secret: ""
  max_events: 5
  mention_levels:
    - "ERROR"
  at_mobiles:
    - ""
  at_all: false

storage:
  output_dir: "data"
